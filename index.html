<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chub Calculator</title>
<style>
/* Layout: single narrow column, answer card first, inputs below. Utilitarian kitchen-counter tool. */
:root {
  --bg: #f4f1ec;
  --surface: #ffffff;
  --ink: #1f2a2e;
  --muted: #5d6b70;
  --line: #d9d4cb;
  --accent: #1f6f6b;
  --accent-ink: #ffffff;
  --accent2: #b5532a;
  --accent2-ink: #ffffff;
  --warn: #a4380f;
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191b;
    --surface: #1d2427;
    --ink: #e8eeef;
    --muted: #9aa9ad;
    --line: #2f3a3e;
    --accent: #5fc4bd;
    --accent-ink: #0d1a1a;
    --accent2: #f0a07a;
    --accent2-ink: #2a140a;
    --warn: #ff9d77;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191b;
  --surface: #1d2427;
  --ink: #e8eeef;
  --muted: #9aa9ad;
  --line: #2f3a3e;
  --accent: #5fc4bd;
  --accent-ink: #0d1a1a;
  --accent2: #f0a07a;
  --accent2-ink: #2a140a;
  --warn: #ff9d77;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  padding: 24px 16px 40px;
}
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.25rem; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cards .result { padding: 16px; min-width: 0; }
.cards .result .big { font-size: 3.25rem; }
.result {
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 14px;
  padding: 20px;
  display: flex; flex-direction: column; gap: 4px;
}
.result .label { font-size: 0.85rem; font-weight: 500; opacity: 0.85; }
.result .big { font-size: 4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.result .unit { font-size: 1rem; font-weight: 500; }
.result .note { font-size: 0.85rem; opacity: 0.9; margin-top: 6px; }
.result.error { background: var(--surface); color: var(--warn); border: 1px solid var(--warn); }
.result.error .big { font-size: 1.1rem !important; line-height: 1.3; }
.cards .result.error { grid-column: 1 / -1; }
#meals-card:not(.error) { background: var(--accent2); color: var(--accent2-ink); }
#meals-card.hidden { display: none; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
input {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; width: 100%; min-height: 44px;
  font-variant-numeric: tabular-nums;
}
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.steps { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; margin: 0; }
.steps div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.steps div:last-child { border-bottom: 0; }
.steps dt { color: var(--muted); font-size: 0.9rem; }
.steps dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.steps .sum { font-size: 0.8rem; color: var(--muted); font-weight: 400; display: block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Chub Calculator</h1>
    <p class="sub">How many chubs to defrost for the dates you pick.</p>
  </header>

  <div class="cards" aria-live="polite">
    <section id="result" class="result"></section>
    <section id="meals-card" class="result"></section>
  </div>

  <section class="panel" aria-label="Inputs">
    <div class="field">
      <label for="start">Start date</label>
      <input id="start" type="date">
    </div>
    <div class="field">
      <label for="end">End date</label>
      <input id="end" type="date">
    </div>
    <div class="field">
      <label for="meals">Meals per day</label>
      <input id="meals" type="number" inputmode="numeric" min="1" step="1" value="2">
    </div>
    <div class="field">
      <label for="meal-g">Each meal (g)</label>
      <input id="meal-g" type="number" inputmode="decimal" min="1" step="any" value="210">
    </div>
    <div class="field">
      <label for="chub-g">Chub weight (g)</label>
      <input id="chub-g" type="number" inputmode="decimal" min="1" step="any" value="500">
    </div>
  </section>

  <dl id="steps" class="steps"></dl>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n.toLocaleString("en-GB", { maximumFractionDigits: 1 }).replace(/,/g, "")) === n ? n.toLocaleString("en-GB", { maximumFractionDigits: 1 }) : n.toLocaleString("en-GB", { maximumFractionDigits: 1 }); };

  function iso(d) {
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function utcDay(s) {
    var p = s.split("-").map(Number);
    return Date.UTC(p[0], p[1] - 1, p[2]);
  }

  var today = iso(new Date());
  $("start").value = today;
  $("end").value = today;

  function render() {
    var result = $("result");
    var mealsCard = $("meals-card");
    var steps = $("steps");
    var s = $("start").value, e = $("end").value;
    var mealsPerDay = parseFloat($("meals").value);
    var mealG = parseFloat($("meal-g").value);
    var chubG = parseFloat($("chub-g").value);

    var problem = null;
    if (!s || !e) problem = "Pick a start and end date.";
    else if (utcDay(e) < utcDay(s)) problem = "The end date is before the start date. Change one of them.";
    else if (!(mealsPerDay > 0) || !(mealG > 0) || !(chubG > 0)) problem = "Meals per day, each meal and chub weight all need a number above 0.";

    if (problem) {
      result.className = "result error";
      result.innerHTML = '<span class="label">Check your inputs</span><span class="big">' + problem + "</span>";
      steps.innerHTML = "";
      mealsCard.className = "result hidden";
      return;
    }

    var days = Math.round((utcDay(e) - utcDay(s)) / 86400000) + 1;
    var meals = days * mealsPerDay;
    var grams = meals * mealG;
    var chubs = Math.ceil(grams / chubG - 1e-9);
    var spare = chubs * chubG - grams;

    result.className = "result";
    result.innerHTML =
      '<span class="label">Chubs to defrost</span>' +
      '<span class="big">' + chubs + "</span>" +
      '<span class="unit">' + (chubs === 1 ? "chub" : "chubs") + " of " + fmt(chubG) + "g</span>" +
      '<span class="note">' + fmt(spare) + "g left over after " + days + (days === 1 ? " day" : " days") + ".</span>";

    mealsCard.className = "result";
    mealsCard.innerHTML =
      '<span class="label">Meals to make up</span>' +
      '<span class="big">' + fmt(meals) + "</span>" +
      '<span class="unit">' + (meals === 1 ? "meal" : "meals") + " of " + fmt(mealG) + "g</span>" +
      '<span class="note">' + days + (days === 1 ? " day" : " days") + " × " + fmt(mealsPerDay) + " a day.</span>";

    var rows = [
      ["Number of days", '<span class="sum">end date − start date + 1</span>', days],
      ["Number of meals", '<span class="sum">' + days + " × " + fmt(mealsPerDay) + "</span>", fmt(meals)],
      ["Volume needed", '<span class="sum">' + fmt(meals) + " × " + fmt(mealG) + "g</span>", fmt(grams) + "g"],
      ["Chubs needed", '<span class="sum">' + fmt(grams) + " ÷ " + fmt(chubG) + ", rounded up</span>", chubs]
    ];
    steps.innerHTML = rows.map(function (r) {
      return "<div><dt>" + r[0] + r[1] + "</dt><dd>" + r[2] + "</dd></div>";
    }).join("");
  }

  // Keep end date from sitting before start when start moves forward.
  $("start").addEventListener("change", function () {
    if ($("end").value && $("start").value && utcDay($("end").value) < utcDay($("start").value)) {
      $("end").value = $("start").value;
    }
  });

  ["start", "end", "meals", "meal-g", "chub-g"].forEach(function (id) {
    $(id).addEventListener("input", render);
    $(id).addEventListener("change", render);
  });
  render();
})();
</script>
</body>
</html>
